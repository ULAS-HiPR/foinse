name: Firmware CI

on:
  workflow_dispatch:
  push:
    branches: [main, ogma/flight-hardening]
    paths:
      - "firmware/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/**"

jobs:
  firmware:
    name: Build flight firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install platformio
      - run: pio run -e stm32f072c8t6
        working-directory: firmware
      - uses: actions/upload-artifact@v4
        with:
          name: foinse-stm32f072c8t6
          path: |
            firmware/.pio/build/stm32f072c8t6/firmware.bin
            firmware/.pio/build/stm32f072c8t6/firmware.elf
          if-no-files-found: error
